<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ramais da Empresa</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f4f6;color:#222}
header{background:#0078D4;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px #0002}
header h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:#eaf4ff;font-size:13px}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 14px;font-weight:bold}
.add{background:#222;color:#fff}.wrap{max-width:1200px;margin:auto;padding:22px}
.search{background:#fff;padding:15px;border-radius:12px;box-shadow:0 2px 8px #0001;margin-bottom:18px;display:flex;gap:10px}
.search input,.search select{padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:0}
.search input{flex:1}.search select{width:220px}
.info{display:flex;gap:12px;margin-bottom:20px}.info div{background:#fff;padding:14px 18px;border-radius:10px;box-shadow:0 2px 7px #0001}
.info b{display:block;font-size:24px}.info span{font-size:12px;color:#777}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{background:#dbeeff;padding:18px;border-radius:5px;box-shadow:3px 5px 12px #0002;position:relative;min-height:190px}
.card:nth-child(2n){background:#cfe7fb}.star{position:absolute;right:10px;top:8px;background:transparent;font-size:22px;padding:4px}
.tag{display:inline-block;background:#0001;padding:5px 8px;border-radius:15px;font-size:11px;font-weight:bold}
.name{font-size:19px;font-weight:bold;margin-top:15px}.role{font-size:12px;color:#666;margin-top:5px}
.number{font-size:30px;font-weight:bold;margin-top:16px}.loc{font-size:12px;color:#666;margin-top:8px}
.actions{display:flex;gap:6px;margin-top:15px}.actions button{padding:7px 9px;font-size:12px}.copy{background:#222;color:#fff}.edit{background:#ddd}.del{background:#ffb0b0}
.empty{background:#fff;padding:50px;text-align:center;border-radius:12px;color:#777;grid-column:1/-1}
.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:20px;z-index:10}.modal.show{display:flex}
.box{background:#fff;width:100%;max-width:480px;border-radius:14px;padding:22px}.box h2{margin-top:0}
.field{margin-bottom:13px}.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:5px}
.field input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.cancel{background:#eee}.save{background:#222;color:#fff}
@media(max-width:650px){header{padding:14px}.wrap{padding:14px}.search{flex-direction:column}.search select{width:100%}.info{display:grid;grid-template-columns:1fr 1fr}.info div:last-child{grid-column:1/-1}}
</style>
<!-- SDK do Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header>
  <div>
    <h1>📝 Ramais da Empresa</h1>
    <p>Painel sincronizado em tempo real (Supabase)</p>
  </div>
  <button class="add" onclick="novoRamal()">＋ Novo Ramal</button>
</header>

<div class="wrap">
  <div class="search">
    <input id="busca" placeholder="🔎 Pesquisar nome, ramal ou setor..." oninput="render()">
    <select id="setorFiltro" onchange="render()"><option value="">Todos os setores</option></select>
  </div>

  <div class="info">
    <div><b id="total">0</b><span>RAMAIS</span></div>
    <div><b id="fav">0</b><span>FAVORITOS</span></div>
    <div><b id="setores">0</b><span>SETORES</span></div>
  </div>

  <div id="lista" class="grid"></div>
</div>

<div id="modal" class="modal">
  <div class="box">
    <h2 id="titulo">Novo Ramal</h2>
    <form id="form">
      <input type="hidden" id="id">
      <div class="field"><label>Nome *</label><input id="nome" required placeholder="Ex.: João da Silva"></div>
      <div class="field"><label>Ramal *</label><input id="ramal" required placeholder="Ex.: 201"></div>
      <div class="field"><label>Setor *</label><input id="setor" required placeholder="Ex.: TI"></div>
      <div class="field"><label>Cargo</label><input id="cargo" placeholder="Ex.: Técnico de Informática"></div>
      <div class="field"><label>Local / Sala</label><input id="local" placeholder="Ex.: Sala 03"></div>
      <div class="foot">
        <button type="button" class="cancel" onclick="fechar()">Cancelar</button>
        <button class="save">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script>
  // Credenciais configuradas corretamente
  const SUPABASE_URL = 'https://jvshwpvmacqahulcpnv.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_I8BwFcJOahV0UFT2sLqbeg_Zx0v3tum';

  const { createClient } = supabase;
  const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let ramais = [];

  async function carregarRamais() {
    const { data, error } = await _supabase.from('ramais').select('*');
    if (error) {
      console.error('Erro ao carregar:', error);
      return;
    }
    ramais = data || [];
    render();
  }

  // Sincronização em tempo real via WebSocket do Supabase
  _supabase
    .channel('public:ramais')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'ramais' }, () => {
      carregarRamais();
    })
    .subscribe();

  carregarRamais();

  function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}

  function atualizarFiltro(){
    const s=document.getElementById("setorFiltro"), atual=s.value;
    const setores=[...new Set(ramais.map(x=>x.setor).filter(Boolean))].sort();
    s.innerHTML='<option value="">Todos os setores</option>'+setores.map(x=>`<option>${esc(x)}</option>`).join("");
    s.value=setores.includes(atual)?atual:"";
  }

  function render(){
    atualizarFiltro();
    const q=document.getElementById("busca").value.toLowerCase();
    const f=document.getElementById("setorFiltro").value;
    let lista=ramais.filter(x=>(!q||`${x.nome} ${x.ramal} ${x.setor} ${x.cargo} ${x.local}`.toLowerCase().includes(q))&&(!f||x.setor===f));
    lista.sort((a,b)=>(b.fav-a.fav)||a.nome.localeCompare(b.nome));
    document.getElementById("total").textContent=ramais.length;
    document.getElementById("fav").textContent=ramais.filter(x=>x.fav).length;
    document.getElementById("setores").textContent=new Set(ramais.map(x=>x.setor)).size;
    const el=document.getElementById("lista");
    el.innerHTML=lista.length?lista.map(x=>`
    <div class="card">
      <button class="star" onclick="favorito(${x.id})">${x.fav?"⭐":"☆"}</button>
      <span class="tag">${esc(x.setor)}</span>
      <div class="name">${esc(x.nome)}</div>
      <div class="role">${esc(x.cargo||"Cargo não informado")}</div>
      <div class="number">☎ ${esc(x.ramal)}</div>
      ${x.local?`<div class="loc">📍 ${esc(x.local)}</div>`:""}
      <div class="actions">
        <button class="copy" onclick="copiar('${String(x.ramal).replace(/\\/g,"\\\\").replace(/'/g,"\\'")}')">Copiar</button>
        <button class="edit" onclick="editar(${x.id})">Editar</button>
        <button class="del" onclick="excluir(${x.id})">Excluir</button>
      </div>
    </div>`).join(""):'<div class="empty"><div style="font-size:40px">🔎</div><h3>Nenhum ramal encontrado</h3><p>Cadastre um novo ramal ou altere a pesquisa.</p></div>';
  }

  function novoRamal(){
    document.getElementById("form").reset();document.getElementById("id").value="";
    document.getElementById("titulo").textContent="Novo Ramal";
    document.getElementById("modal").classList.add("show");document.getElementById("nome").focus();
  }

  function editar(id){
    const x=ramais.find(r=>r.id===id);if(!x)return;
    document.getElementById("id").value=x.id;document.getElementById("nome").value=x.nome;
    document.getElementById("ramal").value=x.ramal;document.getElementById("setor").value=x.setor;
    document.getElementById("cargo").value=x.cargo||"";document.getElementById("local").value=x.local||"";
    document.getElementById("titulo").textContent="Editar Ramal";document.getElementById("modal").classList.add("show");
  }

  function fechar(){document.getElementById("modal").classList.remove("show")}

  document.getElementById("form").onsubmit = async e => {
    e.preventDefault();
    const id=document.getElementById("id").value;
    const dados={
      nome:document.getElementById("nome").value.trim(),
      ramal:document.getElementById("ramal").value.trim(),
      setor:document.getElementById("setor").value.trim(),
      cargo:document.getElementById("cargo").value.trim(),
      local:document.getElementById("local").value.trim()
    };

    if(id){
      await _supabase.from('ramais').update(dados).eq('id', id);
    } else {
      await _supabase.from('ramais').insert([dados]);
    }
    fechar();
    carregarRamais();
  };

  async function excluir(id){
    const x=ramais.find(r=>r.id===id);if(!x)return;
    if(confirm(`Excluir o ramal ${x.ramal} de ${x.nome}?`)){
      await _supabase.from('ramais').delete().eq('id', id);
      carregarRamais();
    }
  }

  async function favorito(id){
    const x=ramais.find(r=>r.id===id);
    if(x){
      await _supabase.from('ramais').update({ fav: !x.fav }).eq('id', id);
      carregarRamais();
    }
  }

  function copiar(v){
    if(navigator.clipboard) navigator.clipboard.writeText(v).then(()=>alert("Ramal "+v+" copiado!"));
    else alert("Ramal: "+v);
  }

  document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")fechar()};
  document.addEventListener("keydown",e=>{if(e.key==="Escape")fechar()});
</script>
</body>
</html>
